<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rota</title>
    <link rel="stylesheet" href="home.css">
    <link rel="shortcut icon" href="./placeholder.png" type="image/x-icon">
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link id="leaflet-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="route.js"></script>
</head>

<body>

    <header class="header">
        <p id="status">Aguardando localização...</p>
    </header>

    <div class="destino-box">
        <input id="destino-input" type="text" placeholder="Digite o destino:" style="width:70%; padding:8px;">
        <div id="autocomplete-list" class="autocomplete-items"></div>

        <button id="btn-ir" style="padding:8px;">Ir</button>
    </div>

    <div id="map-container">
        <div id="map-rotating">
            <div id="map"></div>
        </div>
    </div>

    <div class="btn_container">
        <button id="exit-btn" onclick="location.href='index.html'">Sair</button>
    </div>

    <script id="leaflet-js" src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>
        if (sessionStorage.getItem("logon") !== "ok") {
            alert("Acesso não autorizado! Você será redirecionado para a tela de login.");
            window.location.href = "index.html";
        }
    </script>

</body>

</html>
