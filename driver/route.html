<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Oferta de corrida</title>
    <link rel="stylesheet" href="home.css">
    <link rel="shortcut icon" href="./placeholder.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <script src="route.js"></script>
</head>

<body>

    <div id="turn-overlay" aria-live="polite">
        <div id="turn-arrow" class="hidden">
            <div class="arrow-icon material-symbols-outlined">arrow_forward</div>
            <div class="turn-info">
                <div class="turn-action ">Ação</div>
                <div class="turn-distance">Distância</div>
                <div class="turn-street"></div>
            </div>
        </div>
    </div>


    <div class="destino-box">
        <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
        <input id="destino-input" type="text" placeholder="Para onde vamos?" aria-label="Digite o destino">
        <div id="autocomplete-list" class="autocomplete-items"></div>
        <button id="btn-ir" type="button" aria-label="Buscar destino">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
        </button>
    </div>

    <div class="navigation-controls">
        <div id="route-progress" class="route-progress" role="progressbar"  aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
            <div class="route-progress-track" aria-hidden="true">
                <div id="route-progress-fill" class="route-progress-fill"></div>
            </div>
            <span id="route-progress-label">0%</span>
        </div>
        <button id="start-route" type="button" hidden disabled aria-label="Iniciar navegação">
            <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
            Ir
        </button>
        <button id="navigation-toggle" type="button" role="switch" aria-checked="true" aria-label="Navegação ativa">
            <span class="navigation-toggle-track" aria-hidden="true"></span>
            <span class="material-symbols-outlined" aria-hidden="true">my_location</span>
            <span id="navigation-toggle-label">GPS</span>
        </button>
        <button id="simulate-route-toggle" type="button" aria-pressed="false" disabled aria-label="Simular rota">
            <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
        </button>
    </div>

    <p id="status" role="status" aria-live="polite">Aguardando localização...</p>
    <button id="exit-btn" type="button" onclick="location.href='index.html'" aria-label="Sair">
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
    </button>

    <div id="map-container">
        <div id="map-rotating">
            <div id="map"></div>
        </div>
    </div>

    <section id="ride-card" class="ride-card" aria-labelledby="ride-heading" aria-busy="true">
        <div class="ride-card-header">
            <div class="ride-badges">
                <span class="ride-badge ride-badge-price">
                    <span class="material-symbols-outlined" aria-hidden="true">person</span>
                    Seu Preço
                </span>
            </div>
            <button id="dismiss-ride" class="dismiss-ride" type="button" aria-label="Dispensar oferta">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </div>

        <h1 id="ride-heading" class="ride-price">Carregando...</h1>
        <div class="ride-rating">
            <span class="material-symbols-outlined" aria-hidden="true">star</span>
            <span id="ride-rating">—</span>
            <span class="ride-rating-separator" aria-hidden="true"></span>
            <span class="material-symbols-outlined ride-bolt" aria-hidden="true">bolt</span>
            <span id="ride-pickup-distance">Buscando corrida</span>
        </div>

        <div class="ride-divider"></div>

        <div class="ride-itinerary">
            <div class="itinerary-rail" aria-hidden="true">
                <span class="itinerary-dot"></span>
                <span class="itinerary-line"></span>
                <span class="itinerary-square"></span>
            </div>
            <div class="itinerary-stops">
                <div class="itinerary-stop">
                    <span id="ride-origin-detail" class="stop-detail">Aguardando detalhes da corrida...</span>
                </div>
                <div class="itinerary-stop itinerary-destination">
                    <span class="stop-summary">
                        <span id="ride-duration" class="stop-duration"></span>
                        <span id="ride-distance"></span>
                    </span>
                    <span id="ride-destination" class="stop-detail"></span>
                </div>
            </div>
        </div>

        <div class="ride-divider ride-divider-bottom"></div>
        <div class="ride-offer">
            <span class="material-symbols-outlined" aria-hidden="true">trending_up</span>
            <span id="ride-offer-label">Oferta de valor alto</span>
        </div>
        <p id="ride-feedback" class="ride-feedback" role="status" aria-live="polite"></p>
        <div class="ride-actions">
            <button id="accept-ride" class="accept-ride" type="button" disabled>Aguardando oferta...</button>
            <button id="decline-ride" class="decline-ride" type="button" disabled>Recusar</button>
        </div>
    </section>

    <div id="dismissed-message" class="dismissed-message" hidden>
        Oferta dispensada
        <button id="show-ride" type="button">Ver oferta novamente</button>
    </div>

    <script>
        if (sessionStorage.getItem("logon") !== "ok") {
            alert("Acesso não autorizado! Você será redirecionado para a tela de login.");
            window.location.href = "index.html";
        }
    </script>

</body>

</html>
