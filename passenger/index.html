<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../placeholder.png" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
    <title>Login do passageiro</title>
</head>

<body>
    <main class="login">
        <section class="welcome" aria-labelledby="welcome-title">
            <div class="brand-mark" aria-hidden="true">
                <span class="brand-pin"></span>
            </div>
            <p class="eyebrow">CHECK-IN</p>
            <h1 id="welcome-title">Sua próxima viagem começa aqui.</h1>
        </section>

        <section class="login-panel" aria-labelledby="login-title">
            <div class="panel-heading">
                <p class="eyebrow">ÁREA DO PASSAGEIRO</p>
                <h2 id="login-title">Bem-vindo!</h2>
                <p>Informe seus dados para entrar.</p>
            </div>

            <form class="form" id="passenger-login-form" autocomplete="on">
                <label for="identificador">E-mail ou telefone</label>
                <input
                    type="text"
                    id="identificador"
                    name="identificador"
                    placeholder="Digite seu e-mail ou telefone"
                    autocomplete="username"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

                <p id="login-error" role="alert" hidden></p>
                <button type="submit" id="start-btn">Entrar</button>
            </form>
        </section>
    </main>
    <script>
        const loginForm = document.getElementById('passenger-login-form');
        const loginError = document.getElementById('login-error');
        const loginButton = document.getElementById('start-btn');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginError.hidden = true;
            loginButton.disabled = true;

            try {
                const apiBaseUrl = 'https://api-checkin-s376.onrender.com';
                const response = await fetch(`${apiBaseUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user: document.getElementById('identificador').value.trim(),
                        password: document.getElementById('senha').value
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Não foi possível entrar.');
                }
                if (!data.usuario || data.usuario.id === undefined || data.usuario.id === null) {
                    throw new Error('O servidor não retornou o ID do passageiro.');
                }

                localStorage.setItem('id_passageiro', String(data.usuario.id));
                localStorage.setItem('nome', data.usuario.user || document.getElementById('identificador').value.trim());
                window.location.href = 'home.html';
            } catch (error) {
                console.error('Erro ao entrar como passageiro:', error);
                loginError.textContent = error.message || 'Não foi possível entrar. Tente novamente.';
                loginError.hidden = false;
            } finally {
                loginButton.disabled = false;
            }
        });
    </script>
</body>

</html>
